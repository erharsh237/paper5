    * { box-sizing: border-box; user-select: none; }
    body {

      background: #05060a;
      color: #f8fafc;
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    #viewportStage {
      position: relative;
      width: 1080px;
      height: 1920px;
      background: #090c16;
      overflow: hidden;
      transform-origin: center center;
      box-shadow: 0 0 120px rgba(0,0,0,0.95);
    }
    #cameraRig {
      position: absolute;
      inset: 0;
      transform-origin: 540px 960px;
      will-change: transform;
    }
    .multiplane-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 35%, #182038 0%, #0d1222 55%, #05070e 100%);
    }
    .character-rig {
      position: absolute;
      transform-origin: bottom center;
      will-change: transform;
    }
    .subtitle-banner {
      position: absolute;
      bottom: 110px;
      left: 50%;
      transform: translateX(-50%);
      width: 88%;
      max-width: 880px;
      background: rgba(12, 16, 28, 0.94);
      backdrop-filter: blur(28px);
      border: 1.5px solid rgba(255, 255, 255, 0.14);
      border-radius: 28px;
      padding: 24px 36px;
      text-align: center;
      z-index: 100;
      box-shadow: 0 25px 50px rgba(0,0,0,0.7);
    }

      </div>

    </div><!-- /#cameraRig -->

    <!-- Subtitle Banner -->
    <div id="subtitleBanner" class="subtitle-banner">
      <div id="subtitleSpeaker" class="text-xs font-black uppercase tracking-wider text-indigo-400 mb-1">MAX</div>
      <div id="subtitleText" class="text-3xl font-extrabold text-white leading-snug">"We don't need sleep, Alex. We have momentum."</div>
    </div>
  </div>

  <script>
    // =========================================================================
    // 10-PHONEME ANATOMICAL MOUTH SVGS (Standard Lip-Sync Bank)
    // =========================================================================
    const MOUTH_PHONEMES = {
      REST: `<path d="M -18,0 Q 0,3 18,0" fill="none" stroke="#7f1d1d" stroke-width="3.5" stroke-linecap="round"/>`,
      AI: `<ellipse cx="0" cy="0" rx="18" ry="12" fill="#3b0712" stroke="#7f1d1d" stroke-width="2.5"/><path d="M -12,-6 Q 0,-3 12,-6" stroke="#ffffff" stroke-width="3" fill="none"/><path d="M -8,5 Q 0,-1 8,5" fill="#f43f5e"/>`,
      E: `<path d="M -18,-2 C -10,-8 10,-8 18,-2 C 14,8 -14,8 -18,-2 Z" fill="#3b0712" stroke="#7f1d1d" stroke-width="2.5"/><rect x="-14" y="-3" width="28" height="5" fill="#ffffff"/>`,
      O: `<ellipse cx="0" cy="0" rx="12" ry="15" fill="#3b0712" stroke="#7f1d1d" stroke-width="2.5"/><path d="M -6,-6 Q 0,-4 6,-6" stroke="#ffffff" stroke-width="2" fill="none"/>`,
      U: `<circle cx="0" cy="0" r="8" fill="#3b0712" stroke="#7f1d1d" stroke-width="2.5"/>`,
      MBP: `<line x1="-18" y1="0" x2="18" y2="0" stroke="#7f1d1d" stroke-width="4.5" stroke-linecap="round"/>`,
      FV: `<path d="M -16,0 Q 0,5 16,0" fill="none" stroke="#7f1d1d" stroke-width="3" stroke-linecap="round"/><rect x="-6" y="-6" width="12" height="6" rx="2" fill="#ffffff"/>`,
      LTH: `<ellipse cx="0" cy="0" rx="16" ry="10" fill="#3b0712" stroke="#7f1d1d" stroke-width="2.5"/><path d="M -5,0 Q 0,-6 5,0 Z" fill="#f43f5e"/><path d="M -10,-4 Q 0,-1 10,-4" stroke="#ffffff" stroke-width="2.5" fill="none"/>`,
      CDG: `<path d="M -16,-2 Q 0,-5 16,-2 Q 0,6 -16,-2" fill="#3b0712" stroke="#7f1d1d" stroke-width="2.5"/><line x1="-10" y1="-2" x2="10" y2="-2" stroke="#ffffff" stroke-width="3"/>`,
      SMIRK: `<path d="M -16,2 Q 0,2 18,-6" fill="none" stroke="#7f1d1d" stroke-width="4.5" stroke-linecap="round"/>`
    };

    const cameraRig = document.getElementById('cameraRig');
    const subtitleBanner = document.getElementById('subtitleBanner');
    const subtitleSpeaker = document.getElementById('subtitleSpeaker');
    const subtitleText = document.getElementById('subtitleText');

    const rigMax = document.getElementById('rigMax');
    const maxTorso = document.getElementById('maxTorso');
    const maxHead = document.getElementById('maxHead');
    const maxArmR = document.getElementById('maxArmR');
    const maxArmL = document.getElementById('maxArmL');
    const maxPupilL = document.getElementById('maxPupilL');
    const maxPupilR = document.getElementById('maxPupilR');
    const maxLidL = document.getElementById('maxLidL');
    const maxLidR = document.getElementById('maxLidR');
    const maxMouthSlot = document.getElementById('maxMouthSlot');

    const rigAlex = document.getElementById('rigAlex');
    const alexTorso = document.getElementById('alexTorso');
    const alexHead = document.getElementById('alexHead');
    const alexArmL = document.getElementById('alexArmL');
    const alexArmR = document.getElementById('alexArmR');
    const alexPupilL = document.getElementById('alexPupilL');
    const alexPupilR = document.getElementById('alexPupilR');
    const alexLidL = document.getElementById('alexLidL');
    const alexLidR = document.getElementById('alexLidR');
    const alexEyeSocketR = document.getElementById('alexEyeSocketR');
    const alexMouthSlot = document.getElementById('alexMouthSlot');

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    // =========================================================================
    // DETERMINISTIC PRODUCTION V2 BENCHMARK RENDER FUNCTION (10.0s Locked)
    // =========================================================================
    function renderAtTime(t) {
      // 1. CINEMATIC 5-SHOT CAMERA RIG
      // Shot 1 (0.0s - 2.0s): Wide Establishing (camX = 0, zoom = 1.05)
      // Shot 2 (2.0s - 4.5s): Push to Medium Max (camX = 80, zoom = 1.25)
      // Shot 3 (4.5s - 6.0s): Dynamic Whip-Pan to Alex (camX: 80 -> -200, zoom = 1.30)
      // Shot 4 (6.0s - 9.2s): Expressive Close-Up on Alex (camX = -220, zoom = 1.38)
      // Shot 5 (9.2s - 10.0s): Two-Shot Settle (camX = -70, zoom = 1.15)
      let camX = 0;
      let camZoom = 1.05;

      if (t < 2.0) {
        // Establishing drift
        camX = (t / 2.0) * 40;
        camZoom = 1.05 + (t / 2.0) * 0.08;
      } else if (t >= 2.0 && t < 4.5) {
        // Medium shot Max delivering visionary pitch
        const p = (t - 2.0) / 2.5;
        camX = 40 + p * 40;
        camZoom = 1.13 + p * 0.12;
      } else if (t >= 4.5 && t < 6.0) {
        // Whip-pan across desk
        const p = easeInOutCubic((t - 4.5) / 1.5);
        camX = 80 + (-220 - 80) * p;
        camZoom = 1.25 + (1.38 - 1.25) * p;
      } else if (t >= 6.0 && t < 9.2) {
        // Close-up on Alex sarcastic response
        const p = (t - 6.0) / 3.2;
        camX = -220 - p * 10;
        camZoom = 1.38 + p * 0.04;
      } else {
        // Two-shot settle
        const p = easeInOutCubic((t - 9.2) / 0.8);
        camX = -230 + (-70 - (-230)) * p;
        camZoom = 1.42 + (1.15 - 1.42) * p;
      }

      cameraRig.style.transform = `scale(${camZoom}) translate(${camX}px, 0px)`;

      // 2. MAX ACTING PASS: Anticipation, Gesture, Wristwatch, Lip-Sync
      const maxSpeechStart = 0.8;
      const maxSpeechEnd = 4.55;

      let maxArmRot = 0;
      let maxHeadTilt = 0;
      let maxPhoneme = 'REST';

      // Anticipation (0.0s - 0.8s): Chest rises on inhale, arm pulls back
      if (t < maxSpeechStart) {
        const ant = t / maxSpeechStart;
        maxArmRot = -16 * ant;
        maxHeadTilt = -5 * ant;
        maxTorso.style.transform = `scaleY(${1 + ant * 0.03}) rotate(${-ant * 2}deg)`;
      } else if (t >= maxSpeechStart && t < maxSpeechEnd) {
        // Delivery with visionary point deceleration
        const sTime = t - maxSpeechStart;
        maxArmRot = 16 + Math.sin(sTime * 7) * 10;
        maxHeadTilt = Math.sin(sTime * 5) * 3;
        maxTorso.style.transform = `scaleY(1.0) rotate(1deg)`;

        // Authentic 10-phoneme lip-sync cycle
        const phonemeCycle = ['WQ', 'E', 'REST', 'CDG', 'O', 'REST', 'CDG', 'E', 'MBP', 'REST', 'AI', 'LTH', 'E', 'CDG', 'REST', 'WQ', 'E', 'REST', 'MBP', 'O', 'MBP', 'E', 'CDG'];
        const pIdx = Math.floor(sTime * 6.5) % phonemeCycle.length;
        maxPhoneme = phonemeCycle[pIdx];
      } else {
        // Follow-through settle
        maxArmRot = 5;
        maxHeadTilt = 2;
        maxPhoneme = 'REST';
        maxTorso.style.transform = 'none';
      }

      // Max Blinks (at 0.4s and 3.8s)
      const isMaxBlinking = (t >= 0.4 && t <= 0.55) || (t >= 3.8 && t <= 3.95);
      maxLidL.setAttribute('height', isMaxBlinking ? '28' : '0');
      maxLidR.setAttribute('height', isMaxBlinking ? '28' : '0');

      // Pupils track Alex across the room
      maxPupilL.setAttribute('cx', '76');
      maxPupilR.setAttribute('cx', '132');

      maxArmR.style.transform = `rotate(${maxArmRot}deg)`;
      maxHead.style.transform = `rotate(${maxHeadTilt}deg)`;
      maxMouthSlot.innerHTML = MOUTH_PHONEMES[maxPhoneme] || MOUTH_PHONEMES.REST;

      // 3. ALEX ACTING PASS: Typing Stop, Head Turn, Asymmetrical Brow, Smirk
      const alexSpeechStart = 5.6;
      const alexSpeechEnd = 9.62;

      let alexHeadTurn = 0;
      let alexArmTyping = 0;
      let alexPhoneme = 'SMIRK';

      if (t < 4.5) {
        // Typing at keyboard, looking at terminal screen
        alexArmTyping = Math.sin(t * 22) * 8;
        alexPupilL.setAttribute('cx', '68');
        alexPupilR.setAttribute('cx', '140');
        alexHeadTurn = 0;
      } else if (t >= 4.5 && t < 5.6) {
        // Sarcastic Turn: Head turns 45 degrees, eyebrow arches asymmetrically
        const p = easeInOutCubic((t - 4.5) / 1.1);
        alexHeadTurn = -9 * p;
        alexArmTyping = 0; // Stops typing mid-stroke
        // Pupil darts to lock on Max
        alexPupilL.setAttribute('cx', String(68 - p * 8));
        alexPupilR.setAttribute('cx', String(140 - p * 8));
        // Right eye squints into deadpan glare
        alexEyeSocketR.setAttribute('ry', String(16 - p * 6));
      } else if (t >= alexSpeechStart && t < alexSpeechEnd) {
        // Sarcastic dialogue delivery with deadpan lip-sync
        const aTime = t - alexSpeechStart;
        const alexCycle = ['MBP', 'O', 'MBP', 'E', 'CDG', 'REST', 'CDG', 'O', 'E', 'CDG', 'REST', 'MBP', 'AI', 'CDG', 'REST', 'E', 'CDG'];
        const aIdx = Math.floor(aTime * 5.5) % alexCycle.length;
        alexPhoneme = alexCycle[aIdx];
      } else {
        alexPhoneme = 'SMIRK';
      }

      // Alex comedic double-blink during sarcastic turn (at 4.9s and 5.3s)
      const isAlexBlinking = (t >= 4.9 && t <= 5.05) || (t >= 5.3 && t <= 5.45);
      alexLidL.setAttribute('height', isAlexBlinking ? '32' : '0');
      alexLidR.setAttribute('height', isAlexBlinking ? '32' : '0');

      alexHead.style.transform = `rotate(${alexHeadTurn}deg)`;
      alexArmL.style.transform = `rotate(${alexArmTyping}deg)`;
      alexMouthSlot.innerHTML = MOUTH_PHONEMES[alexPhoneme] || MOUTH_PHONEMES.SMIRK;

      // 4. SUBTITLE BANNER
      if (t >= maxSpeechStart && t < 5.0) {
        subtitleBanner.style.opacity = '1';
        subtitleSpeaker.textContent = 'MAX';
        subtitleSpeaker.className = 'text-xs font-black uppercase tracking-wider text-indigo-400 mb-1';
        subtitleText.textContent = '"We don\'t need sleep, Alex. We have momentum."';
      } else if (t >= alexSpeechStart && t < 9.8) {
        subtitleBanner.style.opacity = '1';
        subtitleSpeaker.textContent = 'ALEX';
        subtitleSpeaker.className = 'text-xs font-black uppercase tracking-wider text-emerald-400 mb-1';
        subtitleText.textContent = '"Momentum doesn\'t pass unit tests, Max."';
      } else {
        subtitleBanner.style.opacity = '0';
      }
    }

    window.renderAtTime = renderAtTime;
    window.addEventListener('DOMContentLoaded', () => renderAtTime(0));
  </script>
</body>
</html>
